<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `viewport-fit=cover` lets the app paint under the notch / home
         indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Hourglass — a glass of sand</title>
    <meta
      name="description"
      content="Hourglass is a local-first timer that is an hourglass: a glass of sand you turn over with a tap, sized to the minutes you want, with sand that piles the way sand does. Nothing leaves your device."
    />
    <!-- Not meant to be found: people find the App Store page and
         apps.agilator.se, not this web edition. -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hourglass" />
    <meta
      property="og:description"
      content="An hourglass you turn over with a tap, sized to the minutes you want. No account, no server."
    />
    <meta property="og:url" content="https://hourglass.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://hourglass.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hourglass" />
    <meta
      name="twitter:description"
      content="An hourglass you turn over with a tap, sized to the minutes you want. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://hourglass.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
